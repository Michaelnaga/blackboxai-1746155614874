<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Space Shooter Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(ellipse at center, #000000 0%, #0f2027 100%);
      margin: 0;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      background: #111;
      border: 2px solid #0ff;
      border-radius: 8px;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-cyan-400">
  <h1 class="text-4xl font-bold mb-4 select-none">Space Shooter Game</h1>
  <canvas id="gameCanvas" width="800" height="600" aria-label="Space Shooter Game Canvas" role="img"></canvas>
  <div id="score" class="mt-4 text-xl select-none">Score: 0</div>
  <div id="gameOver" class="mt-6 text-3xl font-extrabold text-red-600 hidden select-none">Game Over! Press R to Restart</div>
  <script src="script.js"></script>
</body>
</html>
